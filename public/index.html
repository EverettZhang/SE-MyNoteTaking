<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f7f7f8">
    <title>NoteTaker</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="stylesheet" href="/styles.css">
    <script src="/app.js" defer></script>
</head>
<body>
    <div class="app-shell">
        <header class="app-header">
            <span class="brand">NoteTaker</span>
        </header>

        <main class="workspace">
            <aside class="sidebar" aria-label="Your notes">
                <div class="sidebar-heading">
                    <h1>Notes</h1>
                    <button class="button button-primary" id="newNoteBtn" type="button">New note</button>
                </div>

                <label class="sr-only" for="searchBox">Search notes</label>
                <input type="search" class="search-box" id="searchBox" placeholder="Search notes" autocomplete="off">

                <nav class="notes-list" id="notesList" aria-label="Notes">
                    <p class="list-message">Loading notes…</p>
                </nav>
            </aside>

            <section class="note-editor" id="noteEditor" aria-label="Note editor">
                <div class="editor-header">
                    <div class="editor-heading">
                        <span class="section-label" id="editorTitle">Note</span>
                        <span class="save-status" id="saveStatus" role="status" aria-live="polite"></span>
                    </div>
                    <div class="editor-actions" id="editorActions" hidden>
                        <button class="button button-primary" id="saveBtn" type="button">Save</button>
                        <button class="button button-secondary" id="translateBtn" type="button">Translate</button>
                        <button class="button button-danger" id="deleteBtn" type="button">Delete</button>
                    </div>
                </div>

                <div class="message-area" id="messageArea" aria-live="polite"></div>

                <div class="editor-form" id="editorForm" hidden>
                    <label class="sr-only" for="noteTitle">Note title</label>
                    <input type="text" class="title-input" id="noteTitle" placeholder="Untitled" autocomplete="off">

                    <label class="sr-only" for="noteContent">Note content</label>
                    <textarea class="content-input" id="noteContent" placeholder="Start writing…" spellcheck="true"></textarea>

                    <section class="translation-panel" id="translationPanel" aria-label="Traditional Chinese translation" hidden>
                        <label class="translation-label" for="translationResult">Traditional Chinese translation</label>
                        <textarea class="translation-result" id="translationResult" readonly></textarea>
                    </section>
                </div>

                <div class="editor-empty" id="emptyState">
                    <h2>Select a note</h2>
                    <p>Choose a note from the list, or create a new one.</p>
                </div>
            </section>
        </main>
    </div>
</body>
</html>
